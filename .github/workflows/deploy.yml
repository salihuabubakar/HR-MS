# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - master  # Run only when pushing to the master branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to production
        env:
          DEVELOPMENT_URL: ${{ secrets.DEVELOPMENT_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "DEVELOPMENT_URL=$DEVELOPMENT_URL" >> .env
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> .env
          npm install -g serve
          serve -s build
